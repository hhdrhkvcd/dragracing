name: Android Offline APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build offline debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :core:compileJava :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetDrag-3D-Offline-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14
